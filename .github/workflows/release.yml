name: Build y release automatico

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sube APP_VERSION (patch)
        id: bump
        run: |
          $content = Get-Content bitacora_app.py -Raw
          if ($content -notmatch 'APP_VERSION\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
            throw "No se encontro APP_VERSION en bitacora_app.py"
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3] + 1
          $newVersion = "$major.$minor.$patch"
          $newContent = $content -replace 'APP_VERSION\s*=\s*"\d+\.\d+\.\d+"', "APP_VERSION = `"$newVersion`""
          Set-Content -Path bitacora_app.py -Value $newContent -NoNewline
          "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commitea la version nueva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bitacora_app.py
          git commit -m "Sube version a ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Instala dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Compila el .exe
        run: pyinstaller share_src/BitacoraDiaria.spec --noconfirm

      - name: Arma el zip
        run: Compress-Archive -Path dist/BitacoraDiaria -DestinationPath "BitacoraDiaria_v${{ steps.bump.outputs.version }}.zip"

      - name: Publica el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" `
            "BitacoraDiaria_v${{ steps.bump.outputs.version }}.zip" `
            --title "v${{ steps.bump.outputs.version }}" `
            --notes "Publicacion automatica desde GitHub Actions." `
            --target main
